services:
  # 1. Local S3-Compatible Object Storage
  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: atlas_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Automated bucket creation for MinIO
  create-buckets:
    image: quay.io/minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: atlas_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing localminio/atlas-raw-documents;
      exit 0;
      "

  # 2. Local Kafka-Compatible Streaming Broker
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: atlas_redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"

  # Redpanda Web Console
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: atlas_redpanda_console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  # 3. Project Atlas FastAPI Service
  onboarding-service:
    build: .
    container_name: atlas_onboarding_service
    ports:
      - "8000:8000"
    depends_on:
      - minio
      - redpanda
    environment:
      - PROJECT_NAME=Project Atlas - Document Onboarding
      - STORAGE_BACKEND=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=atlas-raw-documents
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_TOPIC_RAW_INGEST=ingest.raw
      - KAFKA_ENABLED=True
      - DATABASE_URL=sqlite+aiosqlite:////app/data/atlas_documents.db
      - CLAMAV_ENABLED=False
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  minio_data: